name: Refresh World Bank FDI data

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/update-fdi.yml"
      - "requirements.txt"
  schedule:
    # 09:15 KST on the first day of each month (GitHub cron uses UTC).
    - cron: "15 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-world-bank-fdi
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Refresh WDI panels
        run: python scripts/update_fdi_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh World Bank FDI panels"
            git push origin HEAD:main
          fi
